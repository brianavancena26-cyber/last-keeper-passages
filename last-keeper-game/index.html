<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162b29"><title>The Last Keeper of the Passages</title><style>:root{font-family:Georgia,serif;color:#f6e9d0;background:#102522}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28433c,#102522 65%);min-height:100vh}main{max-width:670px;margin:auto;padding:25px 18px 90px}.brand{letter-spacing:3px;color:#d8bb7a;text-transform:uppercase;font:12px Arial;text-align:center}h1{font-size:clamp(34px,8vw,56px);text-align:center;line-height:1.05;color:#e7ca8e;margin:18px 0}h2{color:#e7ca8e}p{line-height:1.65}.panel{border:1px solid #8d7955;background:#203832;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 12px 30px #0003}.small{font:13px Arial;color:#c9c4ae}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:14px Arial;color:#e8cf9b}.track{height:8px;background:#43584e;border-radius:9px;overflow:hidden;margin:14px 0}.track div{height:100%;background:#d8bb7a;transition:width .3s}button,input{font:16px Arial;border-radius:10px;padding:14px}button{background:#d8bb7a;color:#1a2b26;border:0;cursor:pointer;font-weight:700;margin:6px 5px 6px 0}button.secondary{background:transparent;border:1px solid #b8a477;color:#f6e9d0}button:disabled{opacity:.5}input{background:#f8f1df;color:#172924;border:2px solid #d8bb7a;width:100%;margin:10px 0}.choices{display:grid;gap:8px}.choices button{text-align:left}.feedback{min-height:24px;color:#f2d18c;font:15px Arial}.seal{display:inline-block;border:1px solid #c4a96b;border-radius:8px;padding:10px;margin:5px;font:13px Arial}.tiles{display:flex;flex-wrap:wrap;gap:7px}.tiles button{font-size:13px}.muted{color:#c5c9b9}footer{text-align:center;font:12px Arial;color:#aebbb1;margin-top:35px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><div class="brand">Paris Top Sights Tours · Digital Mystery</div><h1>The Last Keeper<br>of the Passages</h1><div id="app"></div><footer>A fictional mystery inspired by real Parisian places. No account required. Progress is stored on this device.</footer></main><script>
const chapters=[{place:'Cadet',title:'The Invitation',story:'In 1900, the merchant Émile concealed his archive. He left no heir—only seven tests for the next Keeper. Explore the passages, solve the puzzles and gather four dated seals.',question:'Are you ready to follow the trail?',type:'choice',choices:['Begin the investigation','Leave the archive closed'],answer:0,hints:['Choose to begin your investigation.']},{place:'À la Mère de Famille',title:'The Missing Change',story:'A fictional merchant ledger says: two chocolates and one caramel cost 8 francs; one chocolate and one caramel cost 5 francs. Émile buys two chocolates and three caramels and pays 20 francs.',question:'How many francs in change does he receive?',type:'number',answer:'8',seal:['1761','8'],hints:['Subtract the second purchase from the first.','One chocolate costs 3 francs; a caramel costs 2.','The order costs 12 francs. Subtract from 20.']},{place:'Passage Verdeau',title:'The Torn Notebook',story:'Émile left a notebook page in six fragments. Tap the fragments in the correct order to reconstruct his instruction.',question:'Put the six fragments in order.',type:'sequence',pieces:['The right plan','must agree','with the building.','Check the roof,','the route and','the doorway.'],hints:['Begin with “The right plan”.','The notebook tells you to check three things.','The final fragment is “the doorway.”']},{place:'Passage Jouffroy',title:'The False Plans',story:'Compare the roof, route and doorway of Passage Jouffroy. The sketches here are simplified conceptual descriptions, not surveyed plans.',question:'Which plan best fits a covered passage with an iron-and-glass roof?',type:'choice',choices:['Plan A: open-air courtyard with no roof','Plan B: iron-and-glass covered arcade','Plan C: underground stone tunnel'],answer:1,seal:['1847','4'],hints:['Look up at the covering.','Consider the glass and metal structure.','Choose the covered arcade.']},{place:'Chartier / Passage des Panoramas',title:'The Impossible Witnesses',story:'Evidence: Musée Grévin opened in 1882; Bouillon Chartier opened in 1896. Only one witness describes visits that could have occurred.',question:'Which witness has a historically possible account?',type:'choice',choices:['A: I visited Grévin in 1870.','B: I ate at Chartier in 1890.','C: I visited Grévin and ate at Chartier in 1898.'],answer:2,seal:['1799','2'],hints:['A venue cannot be visited before opening.','Compare 1870, 1890 and 1898 with the opening years.','Both venues existed by 1898.']},{place:'Galerie Vivienne',title:'The Mosaic Cipher',story:'Émile has hidden a message in a fictional digital mosaic. Tap the tiles in the correct order to reveal his instruction.',question:'Reconstruct the message, then read the centre digit.',type:'sequence',pieces:['OLDEST','FIRST','CENTRE','9'],seal:['1826','9'],hints:['Start with the border instruction.','The first two tiles tell you how to order the seals.','Read OLDEST FIRST; the centre is 9.']},{place:'Palais-Royal',title:'The Final Lock',story:'You have four dated seals. The mosaic instructed you to put the oldest first. Arrange the seals by their years, then enter the four-digit combination.',question:'What is the final archive code?',type:'number',answer:'8294',hints:['Collection order is not the final order.','Sort the years from earliest to latest.','1761, 1799, 1826, 1847.']}];
const key='last-keeper-v1';let s;try{s=JSON.parse(localStorage.getItem(key))||{}}catch{s={}};s={stage:0,score:0,hints:{},completed:false,name:'',...s};let selected=[],feedback='';const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(s))}function render(){const c=chapters[s.stage];if(s.completed){app.innerHTML=`<div class="panel" style="text-align:center"><div style="font-size:50px">🏅</div><h2>Welcome, Keepers of the Passages!</h2><p>Émile left no named heir. By following the evidence and unlocking the archive, you have become its new guardians.</p><h2>${esc(s.name||'Keeper of the Passages')}</h2><p>Final score: <strong>${s.score} points</strong></p><p class="small">Digital Keeper Certificate · Paris Top Sights Tours</p><button onclick="window.print()">Print / Save certificate</button><button class="secondary" onclick="restart()">Play again</button></div>`;return}let percent=Math.round(s.stage/chapters.length*100);let html=`<div class="stats"><span>Chapter ${s.stage+1} of ${chapters.length}</span><span>⭐ ${s.score} points</span></div><div class="track" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100" aria-label="Game progress"><div style="width:${percent}%"></div></div><div class="panel"><div class="small">📍 ${esc(c.place)}</div><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p><p><strong>${esc(c.question)}</strong></p>`;if(c.type==='choice')html+=`<div class="choices">${c.choices.map((x,i)=>`<button class="secondary" onclick="check(${i})">${esc(x)}</button>`).join('')}</div>`;if(c.type==='number')html+=`<form onsubmit="event.preventDefault();check(document.getElementById('answer').value)"><label class="small" for="answer">Your answer</label><input id="answer" inputmode="numeric" autocomplete="off" required placeholder="Enter your answer"><button type="submit">Unlock clue</button></form>`;if(c.type==='sequence'){let pieces=c.pieces.map((x,i)=>({x,i}));pieces=pieces.sort((a,b)=>((a.i*3+1)%pieces.length)-((b.i*3+1)%pieces.length));html+=`<p class="small">Selected: ${selected.map(i=>esc(c.pieces[i])).join(' · ')||'None yet'}</p><div class="tiles">${pieces.map(p=>`<button class="secondary" ${selected.includes(p.i)?'disabled':''} onclick="pick(${p.i})">${esc(p.x)}</button>`).join('')}</div><button class="secondary" onclick="selected=[];feedback='';render()">Clear selection</button><button onclick="checkSequence()">Check order</button>`}html+=`<div class="feedback" role="status">${esc(feedback)}</div><button class="secondary" onclick="hint()">Reveal hint (−25 points)</button><div id="hint" class="small"></div></div><div class="panel"><div class="small">Your recovered seals</div>${chapters.filter((x,i)=>i<s.stage&&x.seal).map(x=>`<span class="seal">${x.seal[0]} · ${x.seal[1]}</span>`).join('')||'<p class="muted">No seals collected yet</p>'}</div>`;app.innerHTML=html}function check(v){const c=chapters[s.stage];if(String(v).trim().toLowerCase()===String(c.answer).toLowerCase())advance();else{feedback='Not quite. Examine the evidence or use a hint.';render()}}function pick(i){selected.push(i);feedback='';render()}function checkSequence(){if(selected.length!==chapters[s.stage].pieces.length){feedback='Select every fragment first.';render();return}if(selected.every((x,i)=>x===i))advance();else{feedback='The fragments are not in the right order yet.';render()}}function advance(){s.score+=100;s.stage++;selected=[];feedback='';if(s.stage>=chapters.length){s.completed=true;let n=prompt('Archive unlocked! Enter a team name for your certificate (optional):','');s.name=(n||'').slice(0,60)}save();render();window.scrollTo(0,0)}function hint(){const c=chapters[s.stage],n=s.hints[s.stage]||0;if(n<c.hints.length){s.score=Math.max(0,s.score-25);s.hints[s.stage]=n+1;save();render();document.getElementById('hint').textContent='Hint '+(n+1)+': '+c.hints[n]}else{document.getElementById('hint').textContent='All hints have been shown.'}}function restart(){if(confirm('Erase progress on this device and restart?')){localStorage.removeItem(key);s={stage:0,score:0,hints:{},completed:false,name:''};selected=[];feedback='';render()}}render();</script></body></html>
