<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162b29"><title>The Last Keeper of the Passages</title><style>:root{font-family:Georgia,serif;color:#f6e9d0;background:#102522}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28433c,#102522 65%);min-height:100vh}main{max-width:670px;margin:auto;padding:25px 18px 90px}.brand{letter-spacing:3px;color:#d8bb7a;text-transform:uppercase;font:12px Arial;text-align:center}h1{font-size:clamp(34px,8vw,56px);text-align:center;line-height:1.05;color:#e7ca8e;margin:18px 0}h2{color:#e7ca8e}p{line-height:1.65}.panel{border:1px solid #8d7955;background:#203832;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 12px 30px #0003}.small{font:13px Arial;color:#c9c4ae}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:14px Arial;color:#e8cf9b}.track{height:8px;background:#43584e;border-radius:9px;overflow:hidden;margin:14px 0}.track div{height:100%;background:#d8bb7a;transition:width .3s}button,input{font:16px Arial;border-radius:10px;padding:14px}button{background:#d8bb7a;color:#1a2b26;border:0;cursor:pointer;font-weight:700;margin:6px 5px 6px 0}button.secondary{background:transparent;border:1px solid #b8a477;color:#f6e9d0}button:disabled{opacity:.5}input{background:#f8f1df;color:#172924;border:2px solid #d8bb7a;width:100%;margin:10px 0}.choices{display:grid;gap:8px}.choices button{text-align:left}.feedback{min-height:24px;color:#f2d18c;font:15px Arial}.seal{display:inline-block;border:1px solid #c4a96b;border-radius:8px;padding:10px;margin:5px;font:13px Arial}.tiles{display:flex;flex-wrap:wrap;gap:7px}.tiles button{font-size:13px}.muted{color:#c5c9b9}footer{text-align:center;font:12px Arial;color:#aebbb1;margin-top:35px}@media(prefers-reduced-motion:reduce){*{transition:none!important}} .leaderboard{padding-left:25px;font:15px Arial;line-height:2}.leaderboard li{border-bottom:1px solid #627064}.notice{color:#ffe2a1;font:14px Arial}label{display:block;margin-top:12px} @media print{button,.stats,.track,footer,.leaderboard{display:none!important}body{background:white;color:black}.panel{box-shadow:none;color:black}} .home-button{position:fixed;right:14px;top:12px;z-index:99;padding:11px 15px;background:#d8bb7a;color:#172924;border:2px solid #102522;border-radius:12px;box-shadow:0 3px 14px #0008;font-size:14px} .home-button[hidden]{display:none!important}@media print{.home-button{display:none!important}}</style></head><body><button id="homeButton" class="home-button" type="button" onclick="goHome()" hidden aria-label="Return to welcome page">⌂ Home</button><main><div class="brand">Paris Top Sights Tours · Digital Mystery</div><h1>The Last Keeper<br>of the Passages</h1><div id="app"></div><footer>A fictional mystery inspired by real Parisian places. No account required. Reopening this page starts a new game. Previous attempts remain with your guide.</footer></main><script>
const chapters=[{place:'Cadet',title:'The Invitation',story:'In 1900, the merchant Émile concealed his archive. He left no heir—only seven tests for the next Keeper. Explore the passages, solve the puzzles and gather four dated seals.',question:'Are you ready to follow the trail?',type:'choice',choices:['Begin the investigation','Leave the archive closed'],answer:0,hints:['Choose to begin your investigation.']},{place:'À la Mère de Famille',title:'The Missing Change',story:'A fictional merchant ledger says: two chocolates and one caramel cost 8 francs; one chocolate and one caramel cost 5 francs. Émile buys two chocolates and three caramels and pays 20 francs.',question:'How many francs in change does he receive?',type:'number',answer:'8',seal:['1761','8'],hints:['Subtract the second purchase from the first.','One chocolate costs 3 francs; a caramel costs 2.','The order costs 12 francs. Subtract from 20.']},{place:'Passage Verdeau',title:'The Torn Notebook',story:'Émile left a notebook page in six fragments. Tap the fragments in the correct order to reconstruct his instruction.',question:'Put the six fragments in order.',type:'sequence',pieces:['The right plan','must agree','with the building.','Check the roof,','the route and','the doorway.'],hints:['Begin with “The right plan”.','The notebook tells you to check three things.','The final fragment is “the doorway.”']},{place:'Passage Jouffroy',title:'The False Plans',story:'Compare the roof, route and doorway of Passage Jouffroy. The sketches here are simplified conceptual descriptions, not surveyed plans.',question:'Which plan best fits a covered passage with an iron-and-glass roof?',type:'choice',choices:['Plan A: open-air courtyard with no roof','Plan B: iron-and-glass covered arcade','Plan C: underground stone tunnel'],answer:1,seal:['1847','4'],hints:['Look up at the covering.','Consider the glass and metal structure.','Choose the covered arcade.']},{place:'Chartier / Passage des Panoramas',title:'The Impossible Witnesses',story:'Evidence: Musée Grévin opened in 1882; Bouillon Chartier opened in 1896. Only one witness describes visits that could have occurred.',question:'Which witness has a historically possible account?',type:'choice',choices:['A: I visited Grévin in 1870.','B: I ate at Chartier in 1890.','C: I visited Grévin and ate at Chartier in 1898.'],answer:2,seal:['1799','2'],hints:['A venue cannot be visited before opening.','Compare 1870, 1890 and 1898 with the opening years.','Both venues existed by 1898.']},{place:'Galerie Vivienne',title:'The Mosaic Cipher',story:'Émile has hidden a message in a fictional digital mosaic. Tap the tiles in the correct order to reveal his instruction.',question:'Reconstruct the message, then read the centre digit.',type:'sequence',pieces:['OLDEST','FIRST','CENTRE','9'],seal:['1826','9'],hints:['Start with the border instruction.','The first two tiles tell you how to order the seals.','Read OLDEST FIRST; the centre is 9.']},{place:'Palais-Royal',title:'The Final Lock',story:'You have four dated seals. The mosaic instructed you to put the oldest first. Arrange the seals by their years, then enter the four-digit combination.',question:'What is the final archive code?',type:'number',answer:'8294',hints:['Collection order is not the final order.','Sort the years from earliest to latest.','1761, 1799, 1826, 1847.']}];
// Set this to your deployed Cloudflare Worker URL before publishing.
const API_URL='https://last-keeper-leaderboard.brian-avancena26.workers.dev';
const chaptersTotal=chapters.length;
// Fresh registration on each new page load. Nothing is stored in the browser.
let session=null;
let player=null, selected=[],feedback='',busy=false;
const app=document.getElementById('app');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){/* Intentionally no browser persistence: reopening starts fresh. */}
function goHome(){
  // Reset only the current browser game. The Worker retains historical attempts.
  session=null;player=null;selected=[];feedback='';currentLeaders=[];busy=false;
  render();window.scrollTo(0,0);
}
async function call(action,extra={}){if(!API_URL.startsWith('https://'))throw Error('The organizer must configure the leaderboard service URL first.');const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tour:session?.tour,id:session?.id,token:session?.token,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error||'Service unavailable');return data}
function leaderboard(items=[]){return `<div class="panel"><h2>🏆 Your Tour Leaderboard</h2><p class="small">Only guests using tour code ${esc(session.tour)} appear here. Scores refresh every 20 seconds while this page is open.</p><ol class="leaderboard">${items.length?items.map(p=>`<li>${esc(p.name)} — ${p.score} pts${p.id===session.id?' (you)':''}</li>`).join(''):'<li>No players yet</li>'}</ol><button class="secondary" onclick="refresh()">Refresh scores</button></div>`}
let currentLeaders=[];
function render(){document.getElementById("homeButton").hidden=!session;if(!session){app.innerHTML=`<div class="panel"><h2>Welcome, future Keeper</h2><p>Paris, 1900. A mysterious merchant named Émile has left an archive hidden behind seven tests. Follow your guide through the covered passages, inspect real landmarks, solve fictional puzzles and collect four dated seals. At Palais-Royal, arrange the seals to unlock the archive.</p><p><strong>How to play:</strong> Enter your player name and the tour code your guide gives you. Each correct chapter earns 100 points; each hint costs 25 points. Your score appears alongside other players on this scheduled tour. You can play on your own phone, at your own pace, while staying with the group.</p><p>By joining, your chosen name and game score will be visible to your guide and other players on this tour. Use a nickname rather than your full legal name. No account is required.</p><form onsubmit="event.preventDefault();join()"><label for="nickname">Your player name (nickname recommended)</label><input id="nickname" maxlength="40" required minlength="2" placeholder="e.g. Alex"><label for="tourcode">Tour code from your guide</label><input id="tourcode" maxlength="30" required placeholder="e.g. PARIS-1111"><button type="submit">Join the hunt</button></form><p class="notice" role="status">${esc(feedback)}</p><p class="small">No account or password needed. Reopening or refreshing this page starts a new attempt. Your previous attempt remains visible to your guide. Avoid entering your full legal name.</p></div>`;return}
if(!player){app.innerHTML=`<div class="panel"><p>Connecting to your tour…</p><p class="notice">${esc(feedback)}</p><button onclick="restore()">Retry connection</button></div>`;return}
if(player.completed){app.innerHTML=`<div class="panel" style="text-align:center"><div style="font-size:50px">🏅</div><h2>Welcome, Keeper of the Passages!</h2><p>Émile left no named heir. You followed the evidence and unlocked the archive. You are its new guardian.</p><h2>${esc(player.name)}</h2><p>Final score: <strong>${player.score} points</strong></p><p class="small">Digital Keeper Certificate · Paris Top Sights Tours</p><button onclick="window.print()">Print / Save certificate</button></div>${leaderboard(currentLeaders)}`;return}
const c=chapters[player.stage];const percent=Math.round(player.stage/chaptersTotal*100);let html=`<div class="stats"><span>${esc(player.name)} · Chapter ${player.stage+1} of ${chaptersTotal}</span><span>⭐ ${player.score} points</span></div><div class="track" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100" aria-label="Game progress"><div style="width:${percent}%"></div></div><div class="panel"><div class="small">📍 ${esc(c.place)}</div><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p><p><strong>${esc(c.question)}</strong></p>`;
if(c.type==='choice')html+=`<div class="choices">${c.choices.map((x,i)=>`<button class="secondary" onclick="check('${i}')">${esc(x)}</button>`).join('')}</div>`;
if(c.type==='number')html+=`<form onsubmit="event.preventDefault();check(document.getElementById('answer').value)"><label for="answer">Your answer</label><input id="answer" inputmode="numeric" autocomplete="off" required placeholder="Enter your answer"><button type="submit">Unlock clue</button></form>`;
if(c.type==='sequence'){const pieces=c.pieces.map((x,i)=>({x,i})).sort((a,b)=>((a.i*3+1)%c.pieces.length)-((b.i*3+1)%c.pieces.length));html+=`<p class="small">Selected: ${selected.map(i=>esc(c.pieces[i])).join(' · ')||'None yet'}</p><div class="tiles">${pieces.map(p=>`<button class="secondary" ${selected.includes(p.i)?'disabled':''} onclick="pick(${p.i})">${esc(p.x)}</button>`).join('')}</div><button class="secondary" onclick="selected=[];feedback='';render()">Clear selection</button><button onclick="check(selected.join(','))">Check order</button>`}
const used=player.hints[String(player.stage)]||0;
html+=`<p class="notice" role="status">${esc(feedback)}</p><button class="secondary" onclick="hint()" ${used>=c.hints.length?'disabled':''}>Reveal hint (−25 points)</button><p class="small">${used?'Hints already revealed: '+c.hints.slice(0,used).map(esc).join(' · '):''}</p></div><div class="panel"><div class="small">Recovered seals</div>${chapters.filter((x,i)=>i<player.stage&&x.seal).map(x=>`<span class="seal">${x.seal[0]} · ${x.seal[1]}</span>`).join('')||'<p class="muted">No seals collected yet</p>'}</div>`;
app.innerHTML=html+leaderboard(currentLeaders)}
async function join(){if(busy)return;busy=true;const name=document.getElementById('nickname').value.trim(),tour=document.getElementById('tourcode').value.trim().toUpperCase();session={tour};feedback='Joining…';try{const d=await call('join',{name});session={tour,id:d.id,token:d.token};player=d.player;store();feedback='';await refresh()}catch(e){session=null;feedback=e.message;render()}finally{busy=false}}
async function restore(){try{const d=await call('status');player=d.player;currentLeaders=d.leaders||[];feedback='';render()}catch(e){feedback=e.message;render()}}
async function refresh(){if(!session)return;try{const d=await call('leaderboard');currentLeaders=d.leaders||[];render()}catch(e){feedback='Leaderboard unavailable: '+e.message;render()}}
async function check(answer){if(busy)return;busy=true;try{const d=await call('answer',{answer:String(answer).trim()});player=d.player;if(d.correct){selected=[];feedback='';currentLeaders=d.leaders||currentLeaders;render();window.scrollTo(0,0)}else{feedback='Not quite. Examine the evidence or use a hint.';render()}}catch(e){feedback=e.message;render()}finally{busy=false}}
function pick(i){selected.push(i);feedback='';render()}
async function hint(){if(busy)return;busy=true;try{const d=await call('hint');player=d.player;feedback='Hint '+(d.hintIndex+1)+': '+chapters[player.stage].hints[d.hintIndex];render()}catch(e){feedback=e.message;render()}finally{busy=false}}
render();setInterval(()=>{if(session&&player)refresh()},20000);
</script></body></html>
