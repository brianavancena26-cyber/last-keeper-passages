{place:'Cadet',title:'The Invitation',story:'Émile’s envelope contains one last instruction: Begin where travellers enter the city beneath the city. Look for its letter.',question:'What letter identifies the underground trains in Paris?',type:'choice',choices:['M','P','R'],answer:0,hints:['Look for the symbol marking a Paris Métro entrance.'],after:'The letter M settles into a blank space on Émile’s envelope. A hidden note unfolds:',quote:'Good. You looked up from the page. Remember that. Some answers will be on your screen. Others will be standing in front of you. Your next clue is a purchase recorded at À la Mère de Famille.'},
{place:'À la Mère de Famille',title:'The Merchant’s Account',story:'Inside the notebook is a receipt, with a message across its back: “Before I trusted a document, I checked its smallest details. A careless account can betray a convincing story. Check this purchase. The change will reveal the first seal.” These prices belong to a fictional puzzle.',question:'Two chocolates and one caramel cost 8 francs. One chocolate and one caramel cost 5 francs. Émile buys two chocolates and three caramels and pays 20 francs. How much change should he receive?',type:'number',answer:'8',seal:['1761','8'],hints:['Compare the two purchases to find one chocolate.','One chocolate costs 3 francs and one caramel costs 2 francs.','Two chocolates and three caramels cost 12 francs; subtract from 20.'],after:'The receipt folds back to reveal the first seal:',quote:'1761 — 8. Keep both numbers. One tells you where the seal belongs in time. The other will open the archive. I left my next instruction in a notebook in Passage Verdeau. Unfortunately, you may find it in pieces.'},

{place:'Passage Jouffroy',title:'The Forged Plans',story:'Several architectural drawings appear in Émile’s folder. “The person changing my archive understood that most people glance at a drawing and trust its title. Compare the roof, follow the route and examine the doorway.”',question:'Which plan matches all three features?',type:'choice',choices:['Plan A — open-air courtyard with no roof','Plan B — iron-and-glass covered arcade','Plan C — underground stone tunnel'],answer:1,seal:['1847','4'],hints:['Check the roof first.','The authentic choice has a glass-and-iron covering.','Plan B is the covered arcade.'],after:'The false drawings fade. A seal appears beneath the authentic plan:',quote:'1847 — 4. You have recovered the second seal. But drawings are not the only things that can lie. Three statements await you in the next chapter. Check their dates before trusting their words.'},
{place:'Chartier / Passage des Panoramas',title:'The Impossible Witnesses',story:'Émile’s archive contains three witness statements. His reference cards say Musée Grévin opened in 1882 and Bouillon Chartier opened in 1896. “A confident witness can still tell an impossible story.”',question:'Which witness account is historically possible?',type:'choice',choices:['Witness A: “I visited Musée Grévin in 1870.”','Witness B: “I ate at Chartier in 1890.”','Witness C: “I visited Musée Grévin and ate at Chartier in 1898.”'],answer:2,seal:['1799','2'],hints:['A venue cannot be visited before it opens.','Compare the dates 1870, 1890 and 1898 with 1882 and 1896.','Both venues existed by 1898.'],after:'Witness C’s statement turns over, revealing a seal tucked behind it:',quote:'1799 — 2. Possible does not always mean proven. But you have recognised the two accounts that cannot be true. You have three seals. The final one waits in a broken pattern at Galerie Vivienne.'},

 if(!session){
  app.innerHTML=`<section class="welcome-screen paper-card"><div class="welcome-hero"><div class="welcome-photo" role="img" aria-label="Historic Paris covered passage"></div><div class="welcome-body"><div class="eyebrow">PARIS · 1900</div><h2 class="hero-title">The Last Keeper<br>of the Passages</h2><p class="tagline">An archive lost. Four seals scattered.<br>A secret waiting beneath the glass roofs of Paris.</p><div class="register paper-inset"><h3>Enter the Tour</h3><p>Enter your nickname and tour code to receive Émile’s invitation.</p><label for="nickname">Your Nickname</label><input id="nickname" placeholder="e.g. Alexandra" autocomplete="nickname" maxlength="40"><label for="tourcode">Tour Code</label><input id="tourcode" value="PARIS1111" maxlength="30" autocapitalize="characters"><button class="primary wide" onclick="join()">Begin the Adventure →</button><p class="notice" role="status">${esc(feedback)}</p></div></div></div><div class="welcome-still" aria-hidden="true"></div></section>`;

 }
 if(!player){app.innerHTML=`<section class="paper-card content-page"><h2>Connecting to your tour…</h2><p class="notice">${esc(feedback)}</p><button onclick="restore()">Retry connection</button></section>`;return;}
 if(introStep<3){
  let intro='';
  if(introStep===0)intro=`<section class="paper-card content-page story-page"><div class="eyebrow">PARIS · 1900</div><h2 class="ribbon-heading">The Mystery</h2><div class="story-layout"><img class="story-photo" src="assets/mystery-passage.jpg" alt="Vintage Parisian covered passage"><div class="story-text"><p>For years, the merchant Émile has quietly collected the stories of the covered passages: letters, shopkeepers’ accounts, architectural drawings and memories that never made it into the history books.</p><p>Together, these documents form the <em>Archive of the Passages.</em></p><p>But someone has been replacing its pages with convincing fakes. False plans. Invented memories. Altered accounts.</p><p>If Émile cannot separate the originals from the forgeries, the stories he has spent his life protecting will be lost.</p><p>Before disappearing from public life, he hides the surviving archive and scatters four seals along a route through Paris. Each seal carries a year and a secret digit. Together, they open the archive.</p><p>He leaves one final invitation.</p><p><strong>Today, it has reached you.</strong></p></div></div><button class="primary center-cta" onclick="advanceIntro()">How the Adventure Works →</button></section>`;
  if(introStep===1)intro=`<section class="paper-card content-page how-page"><div class="eyebrow">ÉMILE’S FIELD NOTEBOOK</div><h2 class="ribbon-heading">How the Adventure Works</h2><div class="steps"><div><span class="step-icon">◉</span><p><strong>Explore</strong><br>Follow your guide through Paris’s historic covered passages and iconic stops.</p></div><div><span class="step-icon">⌕</span><p><strong>Observe</strong><br>Examine your surroundings, read clues and uncover hidden details.</p></div><div><span class="step-icon">?</span><p><strong>Solve</strong><br>Restore damaged documents, test suspicious claims and answer seven challenges.</p></div><div><span class="step-icon">✦</span><p><strong>Collect</strong><br>Recover four dated seals. Their secret digits unlock the archive.</p></div></div><div class="seal-section"><h3>The Four Seals</h3><div class="seal-icons"><span>✥</span><span>❖</span><span>✤</span><span>✣</span></div><p>Four chapters award seals. Émile has concealed the order in which they must be used.</p></div><div class="score-rule">100 points per chapter · −25 points for each hint · 700 points maximum</div><p>Your guide leads you through the real Paris. Émile’s notebook leads you through the mystery.</p><button class="primary center-cta" onclick="advanceIntro()">Open Émile’s Invitation →</button></section>`;
  if(introStep===2)intro=`<section class="paper-card content-page invitation-page"><div class="eyebrow">CHAPTER 1 · CADET</div><h2 class="ribbon-heading">Émile’s Invitation</h2><p class="centered">An envelope appears. Its paper is yellowed, its wax seal cracked.</p><div class="letter-scene"><button class="envelope ${letterOpened?'open':''}" aria-label="Open Émile's letter" onclick="openLetter()" ${letterOpened?'disabled':''}><span class="wax">E</span></button><p class="small">${letterOpened?'The seal is broken. Read the letter below.':'Tap the wax seal to open the letter.'}</p></div>${letterOpened?`<div class="letter-content"><p><em>To whoever finds this letter,</em></p><p>I have spent my life listening to the passages of Paris.</p><p>Beneath their glass roofs are stories worth keeping: a merchant’s first sale, an artist’s unfinished sketch, a letter never delivered.</p><p>I gathered them into an archive. Then I discovered that someone had begun changing them.</p><p>I have hidden what remains. To find it, you must learn to observe, calculate and question what you are told.</p><p>Begin where travellers enter the city beneath the city. Look for its letter.</p><p class="signature">— Émile</p></div><button class="primary center-cta" onclick="advanceIntro()">Accept the Invitation →</button>`:''}</section>`;

 if(player.completed){

" target="_blank" rel="noopener noreferrer">www.paristopsightstours.com</a></p><p class="share-note">On Instagram or Facebook, use your phone’s share options or save the photo and upload it in the app.</p></section>${leaderboard(currentLeaders)}`;
  if(souvenirBlob&&souvenirPreviewUrl){const img=document.getElementById('souvenirPreview');img.src=souvenirPreviewUrl;img.hidden=false;document.getElementById('shareSouvenir').disabled=false;document.getElementById('saveSouvenir').disabled=false;}
  return;
 }
 const c=chapters[player.stage],percent=Math.round(player.stage/chaptersTotal*100);

 html+=interactionMarkup(player.stage);
 if(c.type==='choice')html+=`<div class="choices">${c.choices.map((x,i)=>`<button class="secondary" onclick="check('${i}')">${String.fromCharCode(65+i)} &nbsp; ${esc(x)}</button>`).join('')}</div>`;
 if(c.type==='number')html+=`<form onsubmit="event.preventDefault();check(document.getElementById('answer').value)"><label for="answer">Your answer</label><input id="answer" inputmode="numeric" autocomplete="off" required placeholder="Enter your answer"><button class="primary" type="submit">Submit Answer →</button></form>`;
 if(c.type==='sequence'){const pieces=c.pieces.map((x,i)=>({x,i})).sort((a,b)=>((a.i*3+1)%c.pieces.length)-((b.i*3+1)%c.pieces.length));html+=`<p class="small">Selected: ${selected.map(i=>esc(c.pieces[i])).join(' · ')||'None yet'}</p><div class="tiles">${pieces.map(p=>`<button class="secondary" ${selected.includes(p.i)?'disabled':''} onclick="pick(${p.i})">${esc(p.x)}</button>`).join('')}</div><button class="secondary" onclick="selected=[];feedback='';render()">Clear Selection</button><button class="primary" onclick="check(selected.join(','))">Check Order</button>`;}

 html+=`<p class="notice" role="status">${esc(feedback)}</p><button class="secondary" onclick="hint()" ${used>=c.hints.length?'disabled':''}>♧ Hint (−25 points)</button><p class="small">${used?'Hints revealed: '+c.hints.slice(0,used).map(esc).join(' · '):''}</p></section><section class="paper-card seals-tray"><h3>Recovered Seals</h3><div class="recovered">${chapters.filter((x,i)=>i<player.stage&&x.seal).map(x=>`<span class="seal">✥ &nbsp; ${x.seal[0]} · ${x.seal[1]}</span>`).join('')||'<p>No seals collected yet.</p>'}</div></section>`;

async function join(){if(busy)return;busy=true;const name=document.getElementById('nickname').value.trim(),tour=document.getElementById('tourcode').value.trim().toUpperCase();session={tour};feedback='Joining…';try{const d=await call('join',{name});session={tour,id:d.id,token:d.token};player=d.player;introStep=0;letterOpened=false;revealStage=null;store();feedback='';render();await refresh()}catch(e){session=null;feedback=e.message;render()}finally{busy=false}}
async function restore(){try{const d=await call('status');player=d.player;currentLeaders=d.leaders||[];feedback='';store();render()}catch(e){feedback=e.message;render()}}
async function refresh(){if(!session)return;try{const d=await call('leaderboard');currentLeaders=d.leaders||[];if(player?.completed)render()}catch(e){feedback='Leaderboard unavailable: '+e.message;render()}}
async function check(answer){if(busy)return;if(player?.stage===3&&chosenChecks.length<3){feedback='Check the roof, route and doorway before submitting your plan.';render();return;}busy=true;try{const d=await call('answer',{answer:String(answer).trim()});player=d.player;if(d.correct){const solvedStage=player.stage-1;revealStage=solvedStage;selected=[];chosenChecks=[];timelineItems=[];tokens={chocolate:0,caramel:0};feedback='';currentLeaders=d.leaders||currentLeaders;store();render();window.scrollTo(0,0)}else{feedback=wrongFeedback(player.stage,answer);render()}}catch(e){feedback=e.message;render()}finally{busy=false}}
function pick(i){selected.push(i);feedback='';render()}
async function hint(){if(busy)return;busy=true;try{const d=await call('hint');player=d.player;feedback='Hint '+(d.hintIndex+1)+': '+chapters[player.stage].hints[d.hintIndex];render()}catch(e){feedback=e.message;render()}finally{busy=false}}


function wrongFeedback(stage,answer){
 const messages=[
 'Look for the large letter on the Paris Métro entrance.',
 'Check the prices of one chocolate and one caramel, then calculate the change from 20 francs.',
 'The warning must be a complete sentence. Start with the right plan and end with the doorway.',
 'That plan may look convincing, but check its roof, route and doorway against the covered passage.',
 'That witness statement conflicts with at least one opening date. Try the timeline.',
 'The border instruction comes before the centre digit. Read the tiles in order.',
 'The four years must run from oldest to newest. The digit order follows those years.'
 ];return messages[stage]||'Try the evidence again.';
}
function notebookMarkup(){
 const done=player?player.stage:0;
 const seals=chapters.filter((c,i)=>i<done&&c.seal);
 return `<section class="paper-card content-page field-notebook" aria-label="Field notebook"><h2>Émile’s Field Notebook</h2><p>Current objective: ${done<7?esc(chapters[done].title):'The archive is open'}</p><h3>Chapter Map</h3><div class="chapter-map">${chapters.map((c,i)=>`<span class="${i<done?'chapter-done':''}">${i<done?'✓':'○'} ${i+1}. ${esc(c.place)}</span>`).join('')}</div><h3>Four Seal Spaces</h3><div class="notebook-seals">${Array.from({length:4},(_,i)=>seals[i]?`<span class="seal">✥ ${seals[i].seal[0]} — ${seals[i].seal[1]}</span>`:'<span class="empty-seal">◯ Empty seal</span>').join('')}</div><h3>Recovered Evidence</h3><ul>${done>=1?'<li>Cadet: The Métro entrance is marked M.</li>':''}${done>=3?'<li>Verdeau: The right plan must agree with the building. Check the roof, the route and the doorway.</li>':''}${done>=6?'<li>Vivienne: OLDEST FIRST.</li>':''}</ul><button class="secondary" onclick="toggleNotebook()">Close Notebook</button></section>`;
}
function toggleNotebook(){notebookOpen=!notebookOpen;render();}
function continueFromReveal(){if(revealStage===6){const el=document.getElementById('memoryDetail');rememberedDetail=(el?.value||'').trim().slice(0,300);}revealStage=null;notebookOpen=false;store();render();window.scrollTo(0,0);}
function addToken(kind){tokens[kind]=(tokens[kind]||0)+1;document.getElementById('tokenCount').textContent=`Chocolate × ${tokens.chocolate} · Caramel × ${tokens.caramel}`;}
function clearTokens(){tokens={chocolate:0,caramel:0};document.getElementById('tokenCount').textContent='Chocolate × 0 · Caramel × 0';}
function markCheck(feature){if(!chosenChecks.includes(feature))chosenChecks.push(feature);document.getElementById('checkCount').textContent=`${chosenChecks.length} of 3 features examined: ${chosenChecks.join(', ')}`;}
function addTimeline(name){if(!timelineItems.includes(name))timelineItems.push(name);document.getElementById('timelineCount').textContent=timelineItems.join(' → ');}
function interactionMarkup(stage){
 if(stage===1)return `<aside class="evidence-widget"><h3>🍫 Merchant’s Counting Table</h3><p>Move tokens into your working area to test the purchase.</p><div class="widget-buttons"><button class="secondary" onclick="addToken('chocolate')">+ Chocolate</button><button class="secondary" onclick="addToken('caramel')">+ Caramel</button><button class="secondary" onclick="clearTokens()">Clear</button></div><p id="tokenCount">Chocolate × ${tokens.chocolate} · Caramel × ${tokens.caramel}</p></aside>`;
 if(stage===2)return `<aside class="evidence-widget"><h3>🧩 Restore the Torn Page</h3><p>Tap fragments in sequence. Use Clear Selection to start again; this works without dragging.</p></aside>`;
 if(stage===3)return `<aside class="evidence-widget"><h3>📐 Compare the Three Plans</h3><p>These are illustrative concept cards, not verified architectural surveys. A production version needs drawings checked at the precise observation point.</p><div class="plan-grid">${['A','B','C'].map((p,i)=>`<details><summary>Enlarge Plan ${p}</summary><div class="plan-sketch plan-${p.toLowerCase()}"><span>${['Open courtyard','Glass-roofed arcade','Underground tunnel'][i]}</span></div></details>`).join('')}</div><p>Mark the three features you checked:</p><div class="widget-buttons">${['roof','route','doorway'].map(x=>`<button class="secondary" onclick="markCheck('${x}')">✓ ${x}</button>`).join('')}</div><p id="checkCount">${chosenChecks.length} of 3 features examined</p></aside>`;
 if(stage===4)return `<aside class="evidence-widget"><h3>📅 Witness Timeline</h3><p>Tap the reference cards and statements to compare their dates.</p><div class="widget-buttons">${['1882: Grévin opens','1896: Chartier opens','1870: Witness A','1890: Witness B','1898: Witness C'].map(x=>`<button class="secondary" onclick="addTimeline('${x}')">${x}</button>`).join('')}</div><p id="timelineCount">${timelineItems.join(' → ')||'No cards on timeline yet.'}</p></aside>`;
 if(stage===5)return `<aside class="evidence-widget"><h3>◈ The Fictional Digital Mosaic</h3><p>Tap each tile in the correct order. They will snap into the reconstructed message below.</p></aside>`;
 if(stage===6)return `<aside class="evidence-widget"><h3>🔐 Four-Seal Archive Lock</h3><p>1761 — 8 &nbsp; · &nbsp; 1799 — 2 &nbsp; · &nbsp; 1826 — 9 &nbsp; · &nbsp; 1847 — 4</p><p>Arrange the years from oldest to newest and enter their digits below.</p></aside>`;
 return '';
}
async function resumeSaved(){
 try{const saved=JSON.parse(localStorage.getItem('keeper-session-v10')||'null');if(!saved?.session?.token)return;session=saved.session;introStep=saved.introStep??3;letterOpened=!!saved.letterOpened;revealStage=saved.revealStage??null;rememberedDetail=saved.rememberedDetail||'';await restore();}catch(e){localStorage.removeItem('keeper-session-v10');session=null;player=null;render();}
}
async function makeSouvenir(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const status=document.getElementById('souvenirStatus');status.textContent='Preparing your photo…';
 try{
  if(!file.type.startsWith('image/'))throw Error('Please choose an image file.');
  const image=await createImageBitmap(file);const W=1080,H=1350;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#102522';ctx.fillRect(0,0,W,H);
  const photoHeight=940,ratio=Math.max(W/image.width,photoHeight/image.height);
  const dw=image.width*ratio,dh=image.height*ratio;
  ctx.drawImage(image,(W-dw)/2,(photoHeight-dh)/2,dw,dh);
  image.close();
  const grad=ctx.createLinearGradient(0,850,0,1350);grad.addColorStop(0,'rgba(16,37,34,0)');grad.addColorStop(.25,'#102522');grad.addColorStop(1,'#102522');ctx.fillStyle=grad;ctx.fillRect(0,850,W,500);
  ctx.textAlign='center';ctx.fillStyle='#e7ca8e';ctx.font='bold 44px Georgia,serif';ctx.fillText('THE LAST KEEPER',W/2,1010);
  ctx.font='36px Georgia,serif';ctx.fillText('OF THE PASSAGES',W/2,1060);
  ctx.fillStyle='#fff4dc';ctx.font='28px Arial,sans-serif';ctx.fillText('I completed the Paris mystery!',W/2,1125);
  ctx.font='24px Arial,sans-serif';ctx.fillText('Experience it with Paris Top Sights Tours',W/2,1200);
  ctx.fillStyle='#e7ca8e';ctx.font='bold 26px Arial,sans-serif';ctx.fillText('www.paristopsightstours.com',W/2,1250);
  souvenirBlob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Unable to create image.')),'image/jpeg',.9));
  if(souvenirPreviewUrl)URL.revokeObjectURL(souvenirPreviewUrl);
  souvenirPreviewUrl=URL.createObjectURL(souvenirBlob);
  const preview=document.getElementById('souvenirPreview');preview.src=souvenirPreviewUrl;preview.hidden=false;
  document.getElementById('shareSouvenir').disabled=false;document.getElementById('saveSouvenir').disabled=false;
  status.textContent='Ready! Share the photo or save it to upload on Instagram or Facebook.';
 }catch(e){status.textContent='Could not prepare this photo. Please try another image. '+e.message;}
}
function downloadSouvenir(){if(!souvenirBlob)return;const a=document.createElement('a');a.href=souvenirPreviewUrl;a.download='last-keeper-paris-souvenir.jpg';document.body.appendChild(a);a.click();a.remove()}
async function shareSouvenir(){
 if(!souvenirBlob)return;
 const file=new File([souvenirBlob],'last-keeper-paris-souvenir.jpg',{type:'image/jpeg'});
 const status=document.getElementById('souvenirStatus');
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   await navigator.share({files:[file],title:'The Last Keeper of the Passages',text:'I completed The Last Keeper of the Passages in Paris! Book your experience: https://www.paristopsightstours.com/'});
   status.textContent='Share options opened. Choose Instagram, Facebook, or another app.';
  }else{downloadSouvenir();status.textContent='Photo saved. Open Instagram or Facebook to upload it. The booking website is printed on the image.';}
 }catch(e){if(e.name!=='AbortError')status.textContent='Sharing was unavailable. Use Save photo and upload it to your social app.';}
}

render();resumeSaved();setInterval(()=>{if(session&&player&&player.completed)refresh()},20000);
</script></body></html>
