const API_URL='https://last-keeper-leaderboard.brian-avancena26.workers.dev';
const chaptersTotal=chapters.length;
// Fresh registration on each new page load. Nothing is stored in the browser.
let session=null;
let player=null, selected=[],feedback='',busy=false;let introStep=0,letterOpened=false;let souvenirBlob=null;let souvenirPreviewUrl=null;
const app=document.getElementById('app');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){/* Intentionally no browser persistence: reopening starts fresh. */}
function goHome(){
  // Reset only the current browser game. The Worker retains historical attempts.
  session=null;player=null;selected=[];feedback='';introStep=0;letterOpened=false;currentLeaders=[];busy=false;souvenirBlob=null;if(souvenirPreviewUrl)URL.revokeObjectURL(souvenirPreviewUrl);souvenirPreviewUrl=null;
  render();window.scrollTo(0,0);
}
async function call(action,extra={}){if(!API_URL.startsWith('https://'))throw Error('The organizer must configure the leaderboard service URL first.');const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,tour:session?.tour,id:session?.id,token:session?.token,...extra})});const data=await res.json();if(!res.ok)throw Error(data.error||'Service unavailable');return data}
function leaderboard(items=[]){return `<div class="panel"><h2>🏆 Your Tour Leaderboard</h2><p class="small">Only guests using tour code ${esc(session.tour)} appear here. Scores refresh every 20 seconds while this page is open.</p><ol class="leaderboard">${items.length?items.map(p=>`<li>${esc(p.name)} — ${p.score} pts${p.id===session.id?' (you)':''}</li>`).join(''):'<li>No players yet</li>'}</ol><button class="secondary" onclick="refresh()">Refresh scores</button></div>`}
let currentLeaders=[];

function chapterArt(c){
 const files=['cadet','mere-de-famille','verdeau','jouffroy','panoramas','vivienne','palais-royal'];
 const file=files[chapters.indexOf(c)]||'cadet';
 return `<figure class="chapter-photo"><img src="assets/${file}.jpg" alt="Illustrated Paris location: ${esc(c.place)}" loading="lazy"><figcaption>PARIS · 1900 &nbsp; | &nbsp; ${esc(c.place)}</figcaption></figure>`;
}
function openLetter(){letterOpened=true;render();}
function advanceIntro(){introStep++;render();window.scrollTo(0,0);}
function render(){
 document.getElementById('homeButton').hidden=!session;
 const heading=document.getElementById('globalHeading');
 if(heading)heading.hidden=!!session;
 if(!session){
  app.innerHTML=`<section class="welcome-screen paper-card"><div class="welcome-hero"><div class="welcome-photo" role="img" aria-label="Historic Paris covered passage"></div><div class="welcome-body"><div class="eyebrow">PARIS · 1900</div><h2 class="hero-title">The Last Keeper<br>of the Passages</h2><p class="tagline">An archive lost. Four seals scattered.<br>A secret waiting beneath the glass roofs of Paris.</p><div class="register paper-inset"><h3>Enter the Tour</h3><p>Enter your nickname and tour code to receive Émile’s invitation.</p><label for="nickname">Your Nickname</label><input id="nickname" placeholder="e.g. Alexandra" autocomplete="nickname" maxlength="40"><label for="tourcode">Tour Code</label><input id="tourcode" value="PARIS1111" maxlength="30" autocapitalize="characters"><button class="primary wide" onclick="join()">Begin the Adventure →</button><p class="notice" role="status">${esc(feedback)}</p></div></div></div><div class="welcome-still" aria-hidden="true"></div></section>`;
  return;
 }
 if(!player){app.innerHTML=`<section class="paper-card content-page"><h2>Connecting to your tour…</h2><p class="notice">${esc(feedback)}</p><button onclick="restore()">Retry connection</button></section>`;return;}
 if(introStep<3){
  let intro='';
  if(introStep===0)intro=`<section class="paper-card content-page story-page"><div class="eyebrow">PARIS · 1900</div><h2 class="ribbon-heading">The Mystery</h2><div class="story-layout"><img class="story-photo" src="assets/mystery-passage.jpg" alt="Vintage Parisian covered passage"><div class="story-text"><p>For years, the merchant Émile has quietly collected the stories of the covered passages: letters, shopkeepers’ accounts, architectural drawings and memories that never made it into the history books.</p><p>Together, these documents form the <em>Archive of the Passages.</em></p><p>But someone has been replacing its pages with convincing fakes. False plans. Invented memories. Altered accounts.</p><p>If Émile cannot separate the originals from the forgeries, the stories he has spent his life protecting will be lost.</p><p>Before disappearing from public life, he hides the surviving archive and scatters four seals along a route through Paris. Each seal carries a year and a secret digit. Together, they open the archive.</p><p>He leaves one final invitation.</p><p><strong>Today, it has reached you.</strong></p></div></div><button class="primary center-cta" onclick="advanceIntro()">How the Adventure Works →</button></section>`;
  if(introStep===1)intro=`<section class="paper-card content-page how-page"><div class="eyebrow">ÉMILE’S FIELD NOTEBOOK</div><h2 class="ribbon-heading">How the Adventure Works</h2><div class="steps"><div><span class="step-icon">◉</span><p><strong>Explore</strong><br>Follow your guide through Paris’s historic covered passages and iconic stops.</p></div><div><span class="step-icon">⌕</span><p><strong>Observe</strong><br>Examine your surroundings, read clues and uncover hidden details.</p></div><div><span class="step-icon">?</span><p><strong>Solve</strong><br>Restore damaged documents, test suspicious claims and answer seven challenges.</p></div><div><span class="step-icon">✦</span><p><strong>Collect</strong><br>Recover four dated seals. Their secret digits unlock the archive.</p></div></div><div class="seal-section"><h3>The Four Seals</h3><div class="seal-icons"><span>✥</span><span>❖</span><span>✤</span><span>✣</span></div><p>Four chapters award seals. Émile has concealed the order in which they must be used.</p></div><div class="score-rule">100 points per chapter · −25 points for each hint · 700 points maximum</div><p>Your guide leads you through the real Paris. Émile’s notebook leads you through the mystery.</p><button class="primary center-cta" onclick="advanceIntro()">Open Émile’s Invitation →</button></section>`;
  if(introStep===2)intro=`<section class="paper-card content-page invitation-page"><div class="eyebrow">CHAPTER 1 · CADET</div><h2 class="ribbon-heading">Émile’s Invitation</h2><p class="centered">An envelope appears. Its paper is yellowed, its wax seal cracked.</p><div class="letter-scene"><button class="envelope ${letterOpened?'open':''}" aria-label="Open Émile's letter" onclick="openLetter()" ${letterOpened?'disabled':''}><span class="wax">E</span></button><p class="small">${letterOpened?'The seal is broken. Read the letter below.':'Tap the wax seal to open the letter.'}</p></div>${letterOpened?`<div class="letter-content"><p><em>To whoever finds this letter,</em></p><p>I have spent my life listening to the passages of Paris.</p><p>Beneath their glass roofs are stories worth keeping: a merchant’s first sale, an artist’s unfinished sketch, a letter never delivered.</p><p>I gathered them into an archive. Then I discovered that someone had begun changing them.</p><p>I have hidden what remains. To find it, you must learn to observe, calculate and question what you are told.</p><p>Begin where travellers enter the city beneath the city. Look for its letter.</p><p class="signature">— Émile</p></div><button class="primary center-cta" onclick="advanceIntro()">Accept the Invitation →</button>`:''}</section>`;
  app.innerHTML=intro;return;
 }
 if(player.completed){
  app.innerHTML=`<section class="paper-card content-page completion"><div class="eyebrow">THE ARCHIVE IS RESTORED</div><h2 class="ribbon-heading">Mission Complete!</h2><div class="completion-mark">✥ &nbsp; ✦ &nbsp; ✤ &nbsp; ✣</div><p>Congratulations, <strong>${esc(player.name)}</strong>! You followed the evidence, recovered the four seals and unlocked Émile’s archive.</p><div class="certificate"><div class="eyebrow">PARIS TOP SIGHTS TOURS · CERTIFICATE</div><h3>The Last Keeper of the Passages</h3><p>This certifies that</p><div class="certificate-name">${esc(player.name)}</div><p>has successfully completed the investigation.</p><div class="final-score">${player.score} / 700 points</div></div><button class="primary" onclick="window.print()">Print / Save Certificate</button><button class="secondary" onclick="goHome()">⌂ Play Again</button></section><section class="paper-card content-page share-page"><h2>📸 Share Your Adventure</h2><p>Take a photo or select one from your phone to create a Paris souvenir.</p><label for="keeperPhoto">Choose your photo</label><input class="photo-input" id="keeperPhoto" type="file" accept="image/*" capture="environment" onchange="makeSouvenir(event)"><img id="souvenirPreview" class="souvenir-preview" alt="Your Keeper souvenir photo" hidden><div class="share-actions"><button class="primary" id="shareSouvenir" onclick="shareSouvenir()" disabled>Share Photo</button><button id="saveSouvenir" class="secondary" onclick="downloadSouvenir()" disabled>Save Photo</button></div><p id="souvenirStatus" class="share-note" role="status">Your photo stays on your device unless you choose to share it.</p><p>Want to experience Paris for yourself? Book with <strong>Paris Top Sights Tours</strong>.</p><p><a href="https://www.paristopsightstours.com/" target="_blank" rel="noopener noreferrer">www.paristopsightstours.com</a></p><p class="share-note">On Instagram or Facebook, use your phone’s share options or save the photo and upload it in the app.</p></section>${leaderboard(currentLeaders)}`;
  if(souvenirBlob&&souvenirPreviewUrl){const img=document.getElementById('souvenirPreview');img.src=souvenirPreviewUrl;img.hidden=false;document.getElementById('shareSouvenir').disabled=false;document.getElementById('saveSouvenir').disabled=false;}
  return;
 }
 const c=chapters[player.stage],percent=Math.round(player.stage/chaptersTotal*100);
 let html=`<div class="stats"><span>${esc(player.name)} · Chapter ${player.stage+1} of ${chaptersTotal}</span><span>✦ ${player.score} points</span></div><div class="track" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100" aria-label="Game progress"><div style="width:${percent}%"></div></div><section class="paper-card content-page chapter-page"><div class="eyebrow">CHAPTER ${player.stage+1} OF 7 · PARIS 1900</div><h2 class="ribbon-heading">${esc(c.place)}</h2><h3 class="chapter-subtitle">${esc(c.title)}</h3>${chapterArt(c)}<p>${esc(c.story)}</p><p class="question"><strong>${esc(c.question)}</strong></p>`;
 if(c.type==='choice')html+=`<div class="choices">${c.choices.map((x,i)=>`<button class="secondary" onclick="check('${i}')">${String.fromCharCode(65+i)} &nbsp; ${esc(x)}</button>`).join('')}</div>`;
 if(c.type==='number')html+=`<form onsubmit="event.preventDefault();check(document.getElementById('answer').value)"><label for="answer">Your answer</label><input id="answer" inputmode="numeric" autocomplete="off" required placeholder="Enter your answer"><button class="primary" type="submit">Submit Answer →</button></form>`;
 if(c.type==='sequence'){const pieces=c.pieces.map((x,i)=>({x,i})).sort((a,b)=>((a.i*3+1)%c.pieces.length)-((b.i*3+1)%c.pieces.length));html+=`<p class="small">Selected: ${selected.map(i=>esc(c.pieces[i])).join(' · ')||'None yet'}</p><div class="tiles">${pieces.map(p=>`<button class="secondary" ${selected.includes(p.i)?'disabled':''} onclick="pick(${p.i})">${esc(p.x)}</button>`).join('')}</div><button class="secondary" onclick="selected=[];feedback='';render()">Clear Selection</button><button class="primary" onclick="check(selected.join(','))">Check Order</button>`;}
 const used=player.hints[String(player.stage)]||0;
 html+=`<p class="notice" role="status">${esc(feedback)}</p><button class="secondary" onclick="hint()" ${used>=c.hints.length?'disabled':''}>♧ Hint (−25 points)</button><p class="small">${used?'Hints revealed: '+c.hints.slice(0,used).map(esc).join(' · '):''}</p></section><section class="paper-card seals-tray"><h3>Recovered Seals</h3><div class="recovered">${chapters.filter((x,i)=>i<player.stage&&x.seal).map(x=>`<span class="seal">✥ &nbsp; ${x.seal[0]} · ${x.seal[1]}</span>`).join('')||'<p>No seals collected yet.</p>'}</div></section>`;
 app.innerHTML=html;
}
async function join(){if(busy)return;busy=true;const name=document.getElementById('nickname').value.trim(),tour=document.getElementById('tourcode').value.trim().toUpperCase();session={tour};feedback='Joining…';try{const d=await call('join',{name});session={tour,id:d.id,token:d.token};player=d.player;introStep=0;letterOpened=false;store();feedback='';await refresh()}catch(e){session=null;feedback=e.message;render()}finally{busy=false}}
async function restore(){try{const d=await call('status');player=d.player;currentLeaders=d.leaders||[];feedback='';render()}catch(e){feedback=e.message;render()}}
async function refresh(){if(!session)return;try{const d=await call('leaderboard');currentLeaders=d.leaders||[];render()}catch(e){feedback='Leaderboard unavailable: '+e.message;render()}}
async function check(answer){if(busy)return;busy=true;try{const d=await call('answer',{answer:String(answer).trim()});player=d.player;if(d.correct){selected=[];feedback='';currentLeaders=d.leaders||currentLeaders;render();window.scrollTo(0,0)}else{feedback='Not quite. Examine the evidence or use a hint.';render()}}catch(e){feedback=e.message;render()}finally{busy=false}}
function pick(i){selected.push(i);feedback='';render()}
async function hint(){if(busy)return;busy=true;try{const d=await call('hint');player=d.player;feedback='Hint '+(d.hintIndex+1)+': '+chapters[player.stage].hints[d.hintIndex];render()}catch(e){feedback=e.message;render()}finally{busy=false}}

async function makeSouvenir(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const status=document.getElementById('souvenirStatus');status.textContent='Preparing your photo…';
 try{
  if(!file.type.startsWith('image/'))throw Error('Please choose an image file.');
  const image=await createImageBitmap(file);const W=1080,H=1350;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#102522';ctx.fillRect(0,0,W,H);
  const photoHeight=940,ratio=Math.max(W/image.width,photoHeight/image.height);
  const dw=image.width*ratio,dh=image.height*ratio;
  ctx.drawImage(image,(W-dw)/2,(photoHeight-dh)/2,dw,dh);
  image.close();
  const grad=ctx.createLinearGradient(0,850,0,1350);grad.addColorStop(0,'rgba(16,37,34,0)');grad.addColorStop(.25,'#102522');grad.addColorStop(1,'#102522');ctx.fillStyle=grad;ctx.fillRect(0,850,W,500);
  ctx.textAlign='center';ctx.fillStyle='#e7ca8e';ctx.font='bold 44px Georgia,serif';ctx.fillText('THE LAST KEEPER',W/2,1010);
  ctx.font='36px Georgia,serif';ctx.fillText('OF THE PASSAGES',W/2,1060);
  ctx.fillStyle='#fff4dc';ctx.font='28px Arial,sans-serif';ctx.fillText('I completed the Paris mystery!',W/2,1125);
  ctx.font='24px Arial,sans-serif';ctx.fillText('Experience it with Paris Top Sights Tours',W/2,1200);
  ctx.fillStyle='#e7ca8e';ctx.font='bold 26px Arial,sans-serif';ctx.fillText('www.paristopsightstours.com',W/2,1250);
  souvenirBlob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Unable to create image.')),'image/jpeg',.9));
  if(souvenirPreviewUrl)URL.revokeObjectURL(souvenirPreviewUrl);
  souvenirPreviewUrl=URL.createObjectURL(souvenirBlob);
  const preview=document.getElementById('souvenirPreview');preview.src=souvenirPreviewUrl;preview.hidden=false;
  document.getElementById('shareSouvenir').disabled=false;document.getElementById('saveSouvenir').disabled=false;
  status.textContent='Ready! Share the photo or save it to upload on Instagram or Facebook.';
 }catch(e){status.textContent='Could not prepare this photo. Please try another image. '+e.message;}
}
function downloadSouvenir(){if(!souvenirBlob)return;const a=document.createElement('a');a.href=souvenirPreviewUrl;a.download='last-keeper-paris-souvenir.jpg';document.body.appendChild(a);a.click();a.remove()}
async function shareSouvenir(){
 if(!souvenirBlob)return;
 const file=new File([souvenirBlob],'last-keeper-paris-souvenir.jpg',{type:'image/jpeg'});
 const status=document.getElementById('souvenirStatus');
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   await navigator.share({files:[file],title:'The Last Keeper of the Passages',text:'I completed The Last Keeper of the Passages in Paris! Book your experience: https://www.paristopsightstours.com/'});
   status.textContent='Share options opened. Choose Instagram, Facebook, or another app.';
  }else{downloadSouvenir();status.textContent='Photo saved. Open Instagram or Facebook to upload it. The booking website is printed on the image.';}
 }catch(e){if(e.name!=='AbortError')status.textContent='Sharing was unavailable. Use Save photo and upload it to your social app.';}
}

render();setInterval(()=>{if(session&&player)refresh()},20000);
</script></body></html>
